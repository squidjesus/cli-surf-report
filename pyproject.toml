[project]
name = "cli-surf-report"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "numpy>=2.5.2",
    "openmeteo-requests>=1.7.5",
    "rich>=13.0.0",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
]
[project.scripts]
surf = "main:surf"

[tool.flit.module]
name = "main"

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"